# Flink 1.18.x / Java 8. Adapt to the actual Dinky runtime before deployment.
job.name=sls-hunter-flink-mining
parallelism=4
kafka.bootstrap.servers=172.30.82.120:9092,172.30.82.121:9092,172.30.82.122:9092
kafka.input.topics=topic-sas-win-test,topic-sas-jumper-test,topic-sas-linux-test
# Raw messages have no index_family. Exact mapping wins; sas-linux, sas-win, jumper, nginx and hertzbeat are also recognized from the topic or _index name.
kafka.topic.family.topic-sas-linux-test=tracing_sas_linux
kafka.topic.family.topic-sas-win-test=tracing_sas_win
kafka.topic.family.topic-sas-jumper-test=tracing_sas_jumper
kafka.group.id=sls-mining-dev-v3
kafka.output.topic=sls-mining-signals
kafka.dlq.topic=sls-mining-dlq-v0
kafka.late.topic=sls-mining-late-v0
# Must be unique per concurrently deployed job/environment, stable on recovery.
kafka.transaction.prefix=sls-mining-dev-v6
# Unclean restart blocks in initTransactions until this expires.
# Must exceed max(checkpoint.interval.ms, checkpoint.min.pause.ms) + checkpoint.timeout.ms (630000 here), and stay at or under the broker transaction.max.timeout.ms (default 900000).
kafka.transaction.timeout.ms=720000
kafka.linger.ms=5
# Additional client properties: kafka.property.security.protocol, etc.
checkpoint.storage=hdfs://nameservice1/user/sls/sls-hunter/flink-mining/checkpoints
checkpoint.interval.ms=30000
checkpoint.timeout.ms=600000
# Wait after a completed checkpoint; switch to unaligned under sustained backpressure.
checkpoint.min.pause.ms=10000
checkpoint.unaligned.enabled=true
checkpoint.aligned.timeout.ms=10000
# Bound pending-event work per timer callback; remaining work stays in managed state.
flush.max.events=2000
flush.max.ms=100
baseline.days=5
# 先关掉历史对比：不等基线封账，也不等 fleet 快照。只保留行为模式和命令结构规则。
# 改回 true 后，baseline.days 和 fleet.mode 重新生效。
history.compare=false
min.count=2
max.signals=200
host.spike.ratio=2.5
emit.interval.ms=1000
allowed.lateness.ms=600000
retention.days=14
# Omit to publish from the start day minus 3 calendar days in +08:00. Fixed at process start.
# target.start.date=2026-11-03
max.future.skew.ms=300000
max.events.per.family.day=2000000
# Default preserves ES fleet query results via immutable exported snapshots.
# conf/fleet-snapshots.json is packaged at the jar root. Rebuild after replacing it.
fleet.mode=legacy_snapshot
fleet.snapshot.file=classpath:fleet-snapshots.json
rule.version=java-v3-behavior-host-counts
# 结果快照额外 upsert 到 PostgreSQL，Kafka 事务 sink 仍保留。
# 主键是 index_family + target_day，只覆盖 revision 更大的行。密码不要写进 jdbc.url。
# 改成 true 前填好 jdbc.url / jdbc.username / jdbc.password，并确认作业用户能建表，或先执行 deploy/postgres-mining-window.sql。
jdbc.enabled=true
jdbc.url=jdbc:postgresql://172.30.49.56:5432/sls_hunter
jdbc.username=postgres
jdbc.password=*()&^123#@!Lil
jdbc.table=mining_window
jdbc.batch.size=20
jdbc.batch.interval.ms=1000
jdbc.max.retries=5
# Optional exact mode changes ES cardinality/truncation behavior and needs separate validation.
# fleet.mode=exact
# rule.version=java-v2-exact-fleet
