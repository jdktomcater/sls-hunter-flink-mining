# Flink 1.18.x / Java 8. Separate job from the calendar-day MiningJob.
# Own consumer group and transaction prefix, so the two jobs can read the same input.
job.name=sls-hunter-flink-mining-window
parallelism=4
kafka.bootstrap.servers=172.30.82.120:9092,172.30.82.121:9092,172.30.82.122:9092
kafka.input.topics=topic-sas-win-test,topic-sas-jumper-test,topic-sas-linux-test
kafka.topic.family.topic-sas-linux-test=tracing_sas_linux
kafka.topic.family.topic-sas-win-test=tracing_sas_win
kafka.topic.family.topic-sas-jumper-test=tracing_sas_jumper
kafka.group.id=sls-mining-window-fixed-v
kafka.output.topic=sls-mining-window-fixed
kafka.dlq.topic=sls-mining-window-fixed-dlq
kafka.late.topic=sls-mining-window-fixed-late
# Must be unique per concurrently deployed job/enviro0nment, stable on recovery.
kafka.transaction.prefix=sls-mining-window-fixed-v3
# Unclean restart blocks in initTransactions until this expires. Must exceed max(checkpoint.interval.ms, checkpoint.min.pause.ms) + checkpoint.timeout.ms.
kafka.transaction.timeout.ms=720000
kafka.linger.ms=5
checkpoint.storage=hdfs://nameservice1/user/sls/sls-hunter/flink-mining/checkpoints
checkpoint.interval.ms=30000
checkpoint.timeout.ms=600000
checkpoint.min.pause.ms=10000
checkpoint.unaligned.enabled=true
checkpoint.aligned.timeout.ms=10000
baseline.days=5
# Dual channel: high-risk rules plus same-time historical anomalies. Requires coordinated daily SEAL records.
history.compare=false
window.history.spike.ratio=3.0
window.history.baseline.floor=1.0
min.count=2
max.signals=200
host.spike.ratio=2.5
emit.interval.ms=1000
# Tumbling event-time window aligned to the Unix epoch. 300000 is five minutes.
window.size.ms=300000
# Keep every signal the current rules emit. Raise this to store only higher scores.
window.min.score=0
window.out.of.orderness.ms=5000
window.idle.ms=60000
allowed.lateness.ms=600000
retention.days=14
max.future.skew.ms=300000
max.events.per.family.day=2000000
fleet.mode=legacy_snapshot
fleet.snapshot.file=classpath:fleet-snapshots.json
rule.version=window-history-v4-full-command-analysis
# Upserts into mining_window_fixed. jdbc.table is not read by this job.
# Password stays out of jdbc.url. Create the table first with deploy/postgres-mining-window-fixed.sql
# when the job user cannot create tables.
jdbc.enabled=true
jdbc.url=jdbc:postgresql://172.30.49.56:5432/sls_hunter
jdbc.username=postgres
jdbc.password=*()&^123#@!Lil
jdbc.window.table=mining_window_fixed
jdbc.batch.size=20
jdbc.batch.interval.ms=1000
jdbc.max.retries=5
